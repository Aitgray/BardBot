services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    gpus: all

  bardbot:
    build: .
    container_name: bardbot
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
    volumes:
      - ./:/app
      - ./whisper_cache:/root/.cache/whisper
    gpus: all

volumes:
  ollama:

