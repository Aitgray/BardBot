services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    gpus: all
    restart: unless-stopped

  vault_sync:
    image: alpine:3.19
    container_name: vault_sync
    environment:
      VAULT_REPO_URL: ${VAULT_REPO_URL}
      VAULT_BRANCH: ${VAULT_BRANCH:-main}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-43200}
      TZ: America/Los_Angeles
    volumes:
      - obsidian_vault:/vault
      - ./vault_sync.sh:/vault_sync.sh:ro
      - ${VAULT_SSH_KEY_PATH}:/keys/id_ed25519:ro
      - ${VAULT_KNOWN_HOSTS_PATH}:/root/.ssh/known_hosts:ro
    entrypoint: ["/bin/sh", "/vault_sync.sh"]
    restart: unless-stopped

  bardbot:
    build: .
    container_name: bardbot
    depends_on:
      - ollama
      - vault_sync
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      TZ: America/Los_Angeles
      OBSIDIAN_VAULT_PATH: /vault
    volumes:
      - ./:/app
      - ./whisper_cache:/root/.cache/whisper
      - obsidian_vault:/vault:ro
    gpus: all
    restart: unless-stopped

volumes:
  ollama:
  obsidian_vault:
